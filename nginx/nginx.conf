events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cấu hình Log bảo mật
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Luồng HTTP (Cổng 80): Xác thực Certbot và tự động Redirect lên HTTPS
    server {
        listen 80;
        server_name bumbuddy.publicvm.com www.bumbuddy.publicvm.com monitor.bumbuddy.publicvm.com;

        # Thư mục phục vụ Certbot thực hiện thử thách ACME Challenge từ Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Chuyển hướng mọi request HTTP sang HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Cấu hình Chung cho Proxy để giữ nguyên Header IP gốc của Client
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # [1] Định tuyến Domain chính vào App Node.js Bambuddy
    server {
        listen 443 ssl;
        server_name bumbuddy.publicvm.com www.bumbuddy.publicvm.com;

        # Khai báo đường dẫn chứng chỉ (Đọc từ Volume dùng chung với Certbot)
        ssl_certificate /etc/letsencrypt/live/bumbuddy.publicvm.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bumbuddy.publicvm.com/privkey.pem;

        # Tối ưu bảo mật SSL nâng cao
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://web:3000; # Gọi trực tiếp tên service 'web' của Docker
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Định tuyến Subdomain vào giao diện Dashboard Grafana
    server {
        listen 443 ssl;
        server_name monitor.bumbuddy.publicvm.com;

        ssl_certificate /etc/letsencrypt/live/bumbuddy.publicvm.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bumbuddy.publicvm.com/privkey.pem;

        location / {
            proxy_pass http://grafana:3000; # Gọi trực tiếp tên service 'grafana'
        }
    }
}
